<style>
:root{
  --navy:#0a2472; --navy2:#c8102e; --steel:#0a2472; --teal:#0a2472; --teal-light:#e7ecfa;
  --word-font:"Trebuchet MS","Segoe UI",Arial,sans-serif;
  --amber:#f2994a; --amber-light:#fdf1e6; --red:#d64545; --red-light:#fdeaea;
  --green:#2f9e44; --green-light:#eaf7ec;
  --bg-page:#f2f4f7; --bg-card:#ffffff; --border:#e1e5eb;
  --text-1:#1a2332; --text-2:#5b6472; --text-3:#8a92a0;
  --radius:14px; --gap:16px; --shadow:0 1px 3px rgba(20,42,77,0.08);
}
*{box-sizing:border-box;}
body{margin:0;font-family:Arial,"Segoe UI",sans-serif;background:var(--bg-page);color:var(--text-1);font-size:14px;}
.wrap{max-width:900px;margin:0 auto;padding:20px;}
.hidden{display:none !important;}

/* ---------- Đăng nhập / Đăng ký ---------- */
.auth-wrap{max-width:420px;margin:60px auto;padding:20px;}
.auth-card{background:var(--bg-card);border-radius:var(--radius);padding:28px 26px;box-shadow:var(--shadow);}
.auth-card h2{margin:0 0 18px;text-align:center;color:var(--navy2);font-size:19px;}
.auth-tabs{display:flex;gap:8px;margin-bottom:18px;}
.auth-tabs button{flex:1;padding:10px;border-radius:8px;border:2px solid var(--border);background:#fff;font-size:13.5px;font-weight:700;color:var(--text-2);cursor:pointer;}
.auth-tabs button.active{border-color:var(--navy2);color:var(--navy2);background:var(--teal-light);}
.auth-field{margin-bottom:12px;}
.auth-field label{display:block;font-size:12.5px;color:var(--text-2);margin-bottom:5px;}
.auth-field input{width:100%;padding:10px 12px;border:1px solid var(--border);border-radius:8px;font-size:14px;}
.auth-submit{width:100%;padding:11px;border:none;border-radius:8px;background:var(--navy2);color:#fff;font-size:14.5px;font-weight:700;cursor:pointer;margin-top:6px;}
.auth-submit:disabled{opacity:.6;cursor:not-allowed;}
.auth-msg{margin-top:12px;font-size:12.5px;padding:10px 12px;border-radius:8px;display:none;}
.auth-msg.err{display:block;background:var(--red-light);color:#a33;}
.auth-msg.ok{display:block;background:var(--green-light);color:#2f7d3a;}

/* ---------- Thanh người dùng ---------- */
.header-grid{display:flex;align-items:center;gap:12px;}
.header-logo{flex:0 0 auto;display:flex;align-items:center;}
.header-logo img{height:78px;width:auto;max-width:160px;display:block;border-radius:8px;object-fit:contain;}
.header-center{flex:1 1 auto;min-width:0;}
.header-voice{flex:0 0 auto;}
.header-voice select{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);font-size:12.5px;background:rgba(255,255,255,0.15);font-weight:700;color:#fff;cursor:pointer;}
.header-voice select option{color:#1a2332;background:#fff;}
@media (max-width:600px){
  .header-logo img{height:52px;max-width:100px;}
  .header-grid{gap:8px;}
  .header-voice select{font-size:11.5px;padding:5px 6px;}
}

.user-bar{display:flex;align-items:center;justify-content:center;gap:10px;flex-wrap:wrap;margin-bottom:6px;font-size:12.5px;}
.user-bar .user-email{color:#fff;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;max-width:200px;opacity:.95;}
.user-bar .sep{color:rgba(255,255,255,0.5);}
.user-bar select{padding:6px 10px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);font-size:12.5px;background:rgba(255,255,255,0.15);font-weight:700;color:#fff;}
.user-bar select option{color:#1a2332;background:#fff;}
.user-bar .btn-logout{padding:6px 12px;border-radius:6px;border:1px solid rgba(255,255,255,0.4);background:rgba(255,255,255,0.1);font-size:12px;color:#fff;cursor:pointer;}
.user-bar .btn-logout:hover{background:rgba(255,255,255,0.25);}

header.top{background:linear-gradient(120deg,var(--navy),var(--navy2));color:#fff;border-radius:var(--radius);padding:18px 24px 16px;margin-bottom:10px;text-align:center;}
header.top .sub{font-size:12.5px;color:rgba(255,255,255,0.7);}
.flag-strip{height:6px;max-width:180px;margin:0 auto var(--gap);border-radius:3px;overflow:hidden;border:1px solid var(--border);}

.mode-tabs{display:flex;gap:10px;margin-bottom:var(--gap);}
.mode-tabs button{flex:1;padding:12px;border-radius:10px;border:2px solid var(--border);background:var(--bg-card);font-size:14px;font-weight:700;color:var(--text-2);cursor:pointer;}
.mode-tabs button.active{border-color:var(--teal);color:var(--navy2);background:var(--teal-light);}

.selectors{display:flex;gap:10px;margin-bottom:var(--gap);flex-wrap:wrap;justify-content:center;}
.selectors select{padding:9px 14px;border-radius:8px;border:1px solid var(--border);font-size:13.5px;background:#fff;}

.card{background:var(--bg-card);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);}
.loading-msg{text-align:center;padding:60px 20px;color:var(--text-3);}

/* Flashcard */
.flash-wrap{text-align:center;}
.flash-progress{font-size:12.5px;color:var(--text-3);margin-bottom:14px;}
.flash-card{background:linear-gradient(135deg,#f7f9fc,#eef2f8);border-radius:16px;padding:40px 30px;margin-bottom:20px;min-height:220px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;}
.flash-cat{font-size:11.5px;color:var(--text-3);text-transform:uppercase;letter-spacing:.4px;}
.flash-de{font-size:32px;font-weight:800;color:var(--navy2);font-family:var(--word-font);}
.flash-phonetic{font-size:15px;color:var(--text-3);font-style:italic;}
.flash-speak{background:var(--navy2);color:#fff;border:none;width:42px;height:42px;border-radius:50%;font-size:18px;cursor:pointer;margin-top:6px;}
.flash-speak:hover{opacity:.85;}
.flash-meanings{margin-top:14px;font-size:16px;}
.flash-meanings .vi{font-weight:700;color:var(--text-1);}
.flash-meanings .en{color:var(--text-2);font-size:13.5px;margin-top:4px;}
.flash-nav{display:flex;justify-content:center;align-items:center;gap:20px;}
.flash-nav button{background:var(--navy2);color:#fff;border:none;width:48px;height:48px;border-radius:50%;font-size:20px;cursor:pointer;}
.flash-nav button:disabled{opacity:.3;cursor:not-allowed;}
.flash-nav .counter{font-size:13px;color:var(--text-2);min-width:70px;}

/* Game */
.game-progress{text-align:center;font-size:12.5px;color:var(--text-3);margin-bottom:14px;}
.game-cols{display:grid;grid-template-columns:1fr 1fr;gap:16px;}
.game-item{background:#fff;border:2px solid var(--border);border-radius:10px;padding:14px 16px;font-size:14px;cursor:pointer;margin-bottom:10px;transition:all .15s;}
.game-item-phonetic{font-size:11px;color:var(--text-3);font-style:italic;margin-top:3px;font-weight:400;}
.game-item:hover{border-color:var(--teal);}
.game-item.selected{border-color:var(--steel);background:var(--teal-light);}
.game-item.matched{border-color:var(--green);background:var(--green-light);color:var(--green);cursor:default;font-weight:600;}
.game-item.matched:hover{border-color:var(--green);}
.game-item.wrong{border-color:var(--red);background:var(--red-light);animation:shake .3s;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-4px);}75%{transform:translateX(4px);}}
.game-complete{text-align:center;padding:30px;}
.game-complete h3{color:var(--green);font-size:20px;}
.btn{padding:9px 18px;border-radius:8px;border:none;font-size:13.5px;font-weight:700;cursor:pointer;background:var(--teal);color:#fff;}
.config-warning{max-width:600px;margin:60px auto;background:var(--amber-light);color:#8a5a15;padding:20px 24px;border-radius:10px;font-size:13px;line-height:1.6;}
.empty-msg{text-align:center;color:var(--text-3);padding:50px 20px;}
footer.foot{text-align:center;font-size:11.5px;color:var(--text-3);padding:18px 0 4px;}

/* Grammar */
.grammar-lesson{margin-bottom:8px;}
.grammar-title{font-size:19px;margin:0 0 16px;color:var(--navy2);}
.grammar-section{margin-bottom:18px;}
.grammar-section-head{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
.grammar-section-num{flex-shrink:0;width:26px;height:26px;border-radius:50%;background:var(--navy2);color:#fff;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;}
.grammar-section-title{font-size:15px;font-weight:700;color:var(--navy2);}
.grammar-section-body{padding-left:36px;}
.grammar-section-body p{margin:0 0 10px;line-height:1.65;color:var(--text-1);}
.grammar-section-body ul{margin:0 0 10px 20px;padding:0;line-height:1.65;}
.grammar-section-body li{margin-bottom:4px;}
.exercise-section{border-top:1px solid var(--border);margin-top:22px;padding-top:20px;}
.exercise-heading{font-size:16px;margin:0 0 14px;color:var(--text-1);}
.exercise-item{background:var(--bg-page);border:2px solid var(--border);border-radius:10px;padding:14px 16px;margin-bottom:12px;}
.exercise-item.correct{border-color:var(--green);background:var(--green-light);}
.exercise-item.incorrect{border-color:var(--red);background:var(--red-light);}
.exercise-question{font-weight:700;margin-bottom:10px;font-size:13.5px;}
.exercise-option{display:block;padding:5px 0;cursor:pointer;font-size:13.5px;}
.exercise-option input{margin-right:8px;}
.exercise-input{width:100%;max-width:320px;padding:8px 10px;border:1px solid var(--border);border-radius:6px;font-size:13.5px;font-family:inherit;}
.exercise-feedback{margin-top:8px;font-size:12.5px;font-weight:600;min-height:1em;}
.exercise-item.correct .exercise-feedback{color:var(--green);}
.exercise-item.incorrect .exercise-feedback{color:var(--red);}
.grammar-score{margin-top:16px;font-weight:700;font-size:15px;text-align:center;color:var(--navy2);}
</style>
</head>

<!-- ================= APP CHÍNH (chỉ hiện sau khi đăng nhập) ================= -->

  <header class="top">

<!-- Đặt script thư viện ở cuối body (thay vì trong head) để trình duyệt vẽ xong
     giao diện HTML/CSS phía trên trước, không phải chờ tải xong script này mới
     render được gì — cải thiện tốc độ hiển thị lần đầu (đặc biệt trên mạng chậm). -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = "https://vuykuqmebmainyhiotfx.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_8Ro-jEFQqFh7EfbXPfzWaw_V1xrkoyU";

if(SUPABASE_URL.includes("YOUR-PROJECT") || SUPABASE_ANON_KEY.includes("YOUR-ANON")){
  document.getElementById("config-warning").style.display = "block";
  throw new Error("Supabase chưa được cấu hình");
}
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

let THEME = {};
let LANGS = {};
let LANG_ORDER = [];
let currentLanguage = null;
let mode = "flash";
let level = "";
let type = "word";
let topic = "all";
let items = [];
let flashIndex = 0;
let CURRENT_USER = null;
let CURRENT_PROFILE = null;

function L(){ return LANGS[currentLanguage]; }
function fmt(str, vars){ return str.replace(/\{(\w+)\}/g, (_, k) => (vars[k] !== undefined ? vars[k] : "")); }
function shuffle(arr){
  const a = [...arr];
  for(let i=a.length-1;i>0;i--){ const j = Math.floor(Math.random()*(i+1)); [a[i],a[j]] = [a[j],a[i]]; }
  return a;
}

// ============================================================
// Khởi động: nạp cấu hình ngôn ngữ, rồi kiểm tra phiên đăng nhập
// ============================================================
async function boot(){
  const res = await fetch("languages.json");
  const cfg = await res.json();
  THEME = cfg.theme;
  LANGS = cfg.languages;
  LANG_ORDER = Object.keys(LANGS);
  applyGlobalTheme();

  const { data: { session } } = await sb.auth.getSession();
  if(session){
    if(await isAdminUser(session.user.id)){ window.location.href = "QuanLyTuVung.html"; return; }
    await enterApp(session.user);
  }
  else { showAuthScreen(); }

  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(err => console.warn("SW registration failed:", err));
    });
  }
}

async function isAdminUser(userId){
  const { data } = await sb.from("admins").select("user_id").eq("user_id", userId).limit(1);
  return !!(data && data.length);
}

function applyGlobalTheme(){
  const root = document.body.style;
  root.setProperty("--navy", THEME.navy);
  root.setProperty("--navy2", THEME.navy2);
  root.setProperty("--steel", THEME.steel);
  root.setProperty("--teal", THEME.teal);
  root.setProperty("--teal-light", THEME.tealLight);
  root.setProperty("--word-font", THEME.wordFontFamily);
  document.getElementById("meta-theme-color").setAttribute("content", THEME.navy);

  const colors = THEME.flagStripeColors;
  const stops = colors.map((c,i)=>{
    const from = (i/colors.length*100).toFixed(1);
    const to = ((i+1)/colors.length*100).toFixed(1);
    return `${c} ${from}%, ${c} ${to}%`;
  }).join(", ");
  document.getElementById("flag-strip").style.background = `linear-gradient(90deg, ${stops})`;
}

// ============================================================
// Đăng nhập / Đăng ký
// ============================================================
function showAuthScreen(){
  document.getElementById("main-wrap").classList.add("hidden");
  document.getElementById("auth-screen").classList.remove("hidden");
}

document.getElementById("auth-tab-login").addEventListener("click", ()=>{
  document.getElementById("auth-tab-login").classList.add("active");
  document.getElementById("auth-tab-register").classList.remove("active");
  document.getElementById("login-form").classList.remove("hidden");
  document.getElementById("register-form").classList.add("hidden");
});
document.getElementById("auth-tab-register").addEventListener("click", ()=>{
  document.getElementById("auth-tab-register").classList.add("active");
  document.getElementById("auth-tab-login").classList.remove("active");
  document.getElementById("register-form").classList.remove("hidden");
  document.getElementById("login-form").classList.add("hidden");
});

document.getElementById("login-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg = document.getElementById("login-msg");
  msg.className = "auth-msg";
  const btn = document.getElementById("login-submit");
  btn.disabled = true; btn.textContent = "Đang đăng nhập...";
  const email = document.getElementById("login-email").value.trim();
  const password = document.getElementById("login-password").value;
  const { data, error } = await sb.auth.signInWithPassword({ email, password });
  btn.disabled = false; btn.textContent = "Đăng nhập";
  if(error){ msg.className = "auth-msg err"; msg.textContent = error.message; return; }
  if(await isAdminUser(data.user.id)){ window.location.href = "QuanLyTuVung.html"; return; }
  await enterApp(data.user);
});

document.getElementById("register-form").addEventListener("submit", async (e)=>{
  e.preventDefault();
  const msg = document.getElementById("register-msg");
  msg.className = "auth-msg";
  const email = document.getElementById("reg-email").value.trim();
  const password = document.getElementById("reg-password").value;
  const password2 = document.getElementById("reg-password2").value;
  const phone = document.getElementById("reg-phone").value.trim();
  const address = document.getElementById("reg-address").value.trim();

  if(password !== password2){ msg.className = "auth-msg err"; msg.textContent = "Mật khẩu nhập lại không khớp."; return; }

  const btn = document.getElementById("register-submit");
  btn.disabled = true; btn.textContent = "Đang đăng ký...";
  const { data, error } = await sb.auth.signUp({
    email, password,
    options: { data: { phone, address } }
  });
  btn.disabled = false; btn.textContent = "Đăng ký";
  if(error){ msg.className = "auth-msg err"; msg.textContent = error.message; return; }

  if(data.session){
    // Email confirmation đang TẮT ở Supabase -> có phiên đăng nhập ngay
    if(await isAdminUser(data.user.id)){ window.location.href = "QuanLyTuVung.html"; return; }
    await enterApp(data.user);
  } else {
    // Email confirmation đang BẬT -> cần xác nhận email trước khi đăng nhập được
    msg.className = "auth-msg ok";
    msg.textContent = "Đăng ký thành công! Vui lòng kiểm tra email để xác nhận tài khoản trước khi đăng nhập.";
    document.getElementById("register-form").reset();
  }
});

document.getElementById("btn-logout").addEventListener("click", async ()=>{
  await sb.auth.signOut();
  CURRENT_USER = null; CURRENT_PROFILE = null;
  document.getElementById("main-wrap").classList.add("hidden");
  document.getElementById("login-form").reset();
  showAuthScreen();
});

async function enterApp(user){
  CURRENT_USER = user;
  const { data: profile } = await sb.from("profiles").select("*").eq("id", user.id).maybeSingle();
  CURRENT_PROFILE = profile;

  document.getElementById("auth-screen").classList.add("hidden");
  document.getElementById("main-wrap").classList.remove("hidden");
  document.getElementById("user-email-label").textContent = user.email;

  buildLangSelect();
  buildVoiceSelect();
  currentLanguage = (profile && profile.selected_language && LANGS[profile.selected_language])
    ? profile.selected_language
    : LANG_ORDER[0];
  document.getElementById("lang-select").value = currentLanguage;
  level = LANGS[currentLanguage].levels[0].code;

  applyLanguageUI();
  loadItems();
}

function buildLangSelect(){
  const sel = document.getElementById("lang-select");
  sel.innerHTML = LANG_ORDER.map(code=>`<option value="${code}">${LANGS[code].switchLabel}</option>`).join("");
  sel.addEventListener("change", onLanguageSelectChange);
}

async function onLanguageSelectChange(e){
  currentLanguage = e.target.value;
  applyLanguageUI();
  loadItems();
  // Lưu lại lựa chọn ngôn ngữ cho lần đăng nhập sau
  if(CURRENT_USER){
    await sb.from("profiles").update({ selected_language: currentLanguage }).eq("id", CURRENT_USER.id);
  }
}

// Áp dụng nhãn/trình độ theo ngôn ngữ đang chọn (màu sắc KHÔNG đổi theo ngôn ngữ nữa)
// ============================================================
function applyLanguageUI(){
  const cfg = L();
  const u = cfg.ui;

  document.title = u.pageTitle;
  document.getElementById("meta-apple-title").setAttribute("content", u.appleTitle);

  document.getElementById("header-sub").textContent = u.headerSub;
  document.getElementById("tab-flash").textContent = u.tabFlash;
  document.getElementById("tab-game").textContent = u.tabGame;
  document.getElementById("tab-grammar").textContent = u.tabGrammar;
  document.getElementById("opt-word").textContent = u.optWord;
  document.getElementById("opt-sentence").textContent = u.optSentence;
  document.getElementById("footer-text").innerHTML = u.footer;

  const levelSel = document.getElementById("sel-level");
  const prevLevel = level;

document.getElementById("tab-flash").addEventListener("click", ()=>{ mode="flash"; setActiveTab(); loadItems(); });
document.getElementById("tab-game").addEventListener("click", ()=>{ mode="game"; setActiveTab(); loadItems(); });
document.getElementById("tab-grammar").addEventListener("click", ()=>{ mode="grammar"; setActiveTab(); loadGrammar(); });
function setActiveTab(){
  document.getElementById("tab-flash").classList.toggle("active", mode==="flash");
  document.getElementById("tab-game").classList.toggle("active", mode==="game");
  document.getElementById("tab-grammar").classList.toggle("active", mode==="grammar");
  document.getElementById("vocab-filters").style.display = (mode==="grammar") ? "none" : "contents";
}
document.getElementById("sel-level").addEventListener("change", e=>{ level = e.target.value; if(mode==="grammar"){ loadGrammar(); } else { loadItems(); } });
document.getElementById("sel-type").addEventListener("change", e=>{ type = e.target.value; loadItems(); });
document.getElementById("sel-topic").addEventListener("change", e=>{ topic = e.target.value; applyTopicFilter(); if(mode==="flash"){ flashIndex=0; renderFlash(); } else { startGameRound(); } });

// ============================================================
// Chọn giọng đọc: Nam / Nữ
// Giọng thực tế phát ra phụ thuộc danh sách giọng đọc máy/trình duyệt cài sẵn
// cho từng ngôn ngữ — một số máy chỉ có 1 giọng/ngôn ngữ, khi đó hệ thống chỉ
// còn thay đổi được cao độ (pitch)/tốc độ (rate) chứ không đổi được giọng gốc.
// ============================================================
const VOICE_PROFILES = {
  male_adult:   { label: "🧔 Nam",  pitch: 0.85, rate: 0.9, genderHint: "male"   },
  female_adult: { label: "👩 Nữ",   pitch: 1.1,  rate: 0.9, genderHint: "female" },
};
let currentVoiceType = "female_adult";

function buildVoiceSelect(){
  const sel = document.getElementById("voice-select");
  sel.innerHTML = Object.entries(VOICE_PROFILES).map(([key,v]) => `<option value="${key}">${v.label}</option>`).join("");
  sel.value = currentVoiceType;
  sel.addEventListener("change", (e)=>{ currentVoiceType = e.target.value; });
}

// "Đánh thức" danh sách giọng đọc của trình duyệt càng sớm càng tốt (nhiều trình
// duyệt tải danh sách này bất đồng bộ, lần gọi đầu có thể trả về mảng rỗng).
if("speechSynthesis" in window){
  window.speechSynthesis.getVoices();
  window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
}

function pickVoiceForLang(langCode, genderHint){
  const voices = window.speechSynthesis.getVoices();
  const langPrefix = langCode.split("-")[0].toLowerCase();
  const candidates = voices.filter(v => v.lang && v.lang.toLowerCase().startsWith(langPrefix));
  if(candidates.length === 0) return null;
  const maleHint = /male|nam|david|mark|stefan|yannick|thomas|paul|felix|liang|kangkang|yunyang|yunjian/i;
  const femaleHint = /female|nu|hedda|zira|susan|anna|salli|ting|xiaoxiao|yaoyao|mei|xiaoyi|hanhan/i;
  const hintRegex = genderHint === "male" ? maleHint : femaleHint;
  const matched = candidates.find(v => hintRegex.test(v.name));
  return matched || candidates[0];
}

function speak(text){
  if(!('speechSynthesis' in window)) return;
  window.speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  const langCode = L().speechLang;
  const profile = VOICE_PROFILES[currentVoiceType];
  u.lang = langCode;
  u.pitch = profile.pitch;
  u.rate = profile.rate;
  const voice = pickVoiceForLang(langCode, profile.genderHint);
  if(voice) u.voice = voice;
  window.speechSynthesis.speak(u);
}

let allLoadedItems = [];
let lastLoadedKey = null; // "ngôn ngữ|trình độ|loại" của lần tải gần nhất — tránh gọi mạng lại nếu không đổi

async function loadItems(){
  const key = `${currentLanguage}|${level}|${type}`;
  if(key === lastLoadedKey){
    // Bộ lọc không đổi so với lần tải trước (vd chỉ chuyển qua lại giữa 2 tab
    // Từ vựng/Trò chơi) — dùng lại dữ liệu đã có sẵn, khỏi gọi mạng lại.
    applyTopicFilter();
    if(mode === "flash"){ flashIndex = 0; renderFlash(); } else { startGameRound(); }
    return;
  }
  const area = document.getElementById("content-area");
  area.innerHTML = `<div class="loading-msg">${L().ui.loading}</div>`;
  const { data, error } = await sb.from("vocab_items").select("*").eq("language", currentLanguage).eq("level", level).eq("type", type);
  if(error){ area.innerHTML = `<div class="empty-msg">${L().ui.errorPrefix}${error.message}</div>`; return; }
  allLoadedItems = data || [];
  lastLoadedKey = key;
  populateTopics();
  applyTopicFilter();
  if(mode === "flash"){ flashIndex = 0; renderFlash(); } else { startGameRound(); }
}

function populateTopics(){
  const sel = document.getElementById("sel-topic");
  const cats = Array.from(new Set(allLoadedItems.map(i=>i.category).filter(Boolean))).sort();
  const prev = topic;
  sel.innerHTML = `<option value="all">${L().ui.optAllTopics}</option>` + cats.map(c=>`<option value="${c}">${c}</option>`).join("");
  topic = cats.includes(prev) ? prev : "all";
  sel.value = topic;
}

function applyTopicFilter(){
  const filtered = topic === "all" ? allLoadedItems : allLoadedItems.filter(i=>i.category===topic);
  items = shuffle(filtered);
}

function renderFlash(){
  const area = document.getElementById("content-area");
  if(items.length === 0){ area.innerHTML = `<div class="empty-msg">${L().ui.emptyVocab}</div>`; return; }
  if(flashIndex >= items.length) flashIndex = 0;
  const it = items[flashIndex];
  area.innerHTML = `
    <div class="flash-wrap">
      <div class="flash-progress">${flashIndex+1} / ${items.length}</div>
      <div class="flash-card">
        ${it.category ? `<div class="flash-cat">${it.category}</div>` : ''}
        <div class="flash-de">${it.de_text}</div>
        ${it.phonetic ? `<div class="flash-phonetic">${it.phonetic}</div>` : ''}
        <button class="flash-speak" id="btn-speak" title="${L().ui.speakTitle}">🔊</button>
        <div class="flash-meanings">
          <div class="vi">${it.vi_meaning}</div>
          ${it.en_meaning ? `<div class="en">${it.en_meaning}</div>` : ''}
        </div>
      </div>
      <div class="flash-nav">
        <button id="btn-prev" ${flashIndex===0?'disabled':''}>‹</button>
        <span class="counter">${flashIndex+1} / ${items.length}</span>
        <button id="btn-next" ${flashIndex===items.length-1?'disabled':''}>›</button>
      </div>
    </div>`;
  document.getElementById("btn-speak").addEventListener("click", ()=> speak(it.de_text));
  document.getElementById("btn-prev").addEventListener("click", ()=>{ if(flashIndex>0){ flashIndex--; renderFlash(); } });
  document.getElementById("btn-next").addEventListener("click", ()=>{ if(flashIndex<items.length-1){ flashIndex++; renderFlash(); } });
}

let gamePool = [];
let gameBatch = [];
let leftOrder = [];
let rightOrder = [];
let selectedLeftId = null;
let matchedIds = new Set();

function startGameRound(){
  if(items.length === 0){ document.getElementById("content-area").innerHTML = `<div class="empty-msg">${L().ui.emptyVocab}</div>`; return; }
  gamePool = shuffle(items);
  nextBatch();
}

function nextBatch(){
  if(gamePool.length === 0){
    const u = L().ui;
    document.getElementById("content-area").innerHTML = `
      <div class="game-complete">
        <h3>${u.gameComplete}</h3>
        <p style="color:var(--text-2);">${fmt(u.gameCompleteSub, {n: items.length, level: level})}</p>
        <button class="btn" id="btn-restart">${u.restartBtn}</button>
      </div>`;
    document.getElementById("btn-restart").addEventListener("click", startGameRound);
    return;
  }
  gameBatch = gamePool.splice(0, Math.min(5, gamePool.length));
  leftOrder = shuffle(gameBatch);
  rightOrder = shuffle(gameBatch);
  selectedLeftId = null;
  matchedIds = new Set();
  renderGame();
}

function renderGame(){
  const area = document.getElementById("content-area");
  area.innerHTML = `
    <div class="game-progress">${fmt(L().ui.gameProgress, {remain: gamePool.length, matched: matchedIds.size, total: gameBatch.length})}</div>
    <div class="game-cols">
      <div id="col-left"></div>
      <div id="col-right"></div>
    </div>`;
  const colLeft = document.getElementById("col-left");
  const colRight = document.getElementById("col-right");

  leftOrder.forEach(it=>{
    const div = document.createElement("div");
    div.className = "game-item" + (matchedIds.has(it.id) ? " matched" : "") + (selectedLeftId===it.id ? " selected" : "");
    div.innerHTML = escHtml(it.de_text) + (it.phonetic ? `<div class="game-item-phonetic">${escHtml(it.phonetic)}</div>` : "");
    div.dataset.id = it.id;
    if(!matchedIds.has(it.id)){ div.addEventListener("click", ()=> onLeftClick(it.id)); }
    colLeft.appendChild(div);
  });

  rightOrder.forEach(it=>{
    const div = document.createElement("div");
    div.className = "game-item" + (matchedIds.has(it.id) ? " matched" : "");
    div.textContent = it.vi_meaning;
    div.dataset.id = it.id;
    if(!matchedIds.has(it.id)){ div.addEventListener("click", ()=> onRightClick(it.id)); }
    colRight.appendChild(div);
  });
}

function onLeftClick(id){ selectedLeftId = (selectedLeftId === id) ? null : id; renderGame(); }

function onRightClick(rightId){
  if(selectedLeftId === null) return;
  if(selectedLeftId === rightId){
    matchedIds.add(rightId);
    selectedLeftId = null;
    if(matchedIds.size === gameBatch.length){ setTimeout(nextBatch, 500); } else { renderGame(); }
  } else {
    const leftEl = document.querySelector(`#col-left [data-id="${selectedLeftId}"]`);
    const rightEl = document.querySelector(`#col-right [data-id="${rightId}"]`);
    if(leftEl) leftEl.classList.add("wrong");
    if(rightEl) rightEl.classList.add("wrong");
    setTimeout(()=>{ selectedLeftId = null; renderGame(); }, 500);
  }
}

function escHtml(s){
  return String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
function formatGrammarContent(text){
  const raw = String(text||'').trim();
  const lines = raw.split('\n');
  const sections = [];
  let current = null;
  lines.forEach(line=>{
    const trimmed = line.trim();
    if(trimmed.startsWith('## ')){ current = { title: trimmed.slice(3).trim(), lines: [] }; sections.push(current); }
    else { if(!current){ current = { title: '', lines: [] }; sections.push(current); } current.lines.push(line); }
  });
  return sections.map((sec, idx)=>{
    const bodyHtml = formatBlockLines(sec.lines);
    const head = sec.title
      ? `<div class="grammar-section-head"><span class="grammar-section-num">${idx+1}</span><span class="grammar-section-title">${escHtml(sec.title)}</span></div>`
      : '';
    return `<div class="grammar-section">${head}<div class="grammar-section-body">${bodyHtml}</div></div>`;
  }).join('');
}
function formatBlockLines(lines){
  const text = lines.join('\n');
  const blocks = text.trim().split(/\n\s*\n/);
  return blocks.filter(b=>b.trim()).map(block=>{
    const ls = block.split('\n').map(l=>l.trim()).filter(Boolean);
    let html = '', listBuf = [], textBuf = [];
    const flushList = ()=>{ if(listBuf.length){ html += '<ul>' + listBuf.map(l=>`<li>${escHtml(l.slice(2))}</li>`).join('') + '</ul>'; listBuf = []; } };
    const flushText = ()=>{ if(textBuf.length){ html += '<p>' + textBuf.map(escHtml).join('<br>') + '</p>'; textBuf = []; } };
    ls.forEach(l=>{ if(l.startsWith('- ')){ flushText(); listBuf.push(l); } else { flushList(); textBuf.push(l); } });
    flushList(); flushText();
    return html;
  }).join('');
}

let grammarCache = {}; // key "ngôn ngữ|trình độ" -> { lesson, exercises } đã tải, tránh gọi mạng lại

async function loadGrammar(){
  const key = `${currentLanguage}|${level}`;
  const area = document.getElementById("content-area");

  if(grammarCache[key] !== undefined){
    // Đã tải trước đó — dùng lại, chỉ xáo trộn lại thứ tự bài tập cho mỗi lần xem
    const cached = grammarCache[key];
    if(cached === null){ area.innerHTML = `<div class="empty-msg">${L().ui.emptyGrammar}</div>`; return; }
    renderGrammar(cached.lesson, shuffle(cached.exercises));
    return;
  }

  area.innerHTML = `<div class="loading-msg">${L().ui.loading}</div>`;
  const { data: lessonData, error: lessonError } = await sb.from("grammar_lessons").select("*").eq("language", currentLanguage).eq("level", level).maybeSingle();
  if(lessonError){ area.innerHTML = `<div class="empty-msg">${L().ui.errorPrefix}${lessonError.message}</div>`; return; }
  if(!lessonData){ grammarCache[key] = null; area.innerHTML = `<div class="empty-msg">${L().ui.emptyGrammar}</div>`; return; }
  const { data: exData, error: exError } = await sb.from("grammar_exercises").select("*").eq("lesson_id", lessonData.id).order("order_index");
  if(exError){ area.innerHTML = `<div class="empty-msg">${L().ui.errorPrefix}${exError.message}</div>`; return; }
  grammarCache[key] = { lesson: lessonData, exercises: exData || [] };
  renderGrammar(lessonData, shuffle(exData || []));
}

function renderGrammar(lesson, exs){
  const area = document.getElementById("content-area");
  const u = L().ui;
  const exHtml = exs.map((ex, idx)=>{
    let inputHtml;
    if(ex.type === "multiple_choice"){
      const opts = (ex.options || "").split(",").map(o=>o.trim()).filter(Boolean);
      inputHtml = opts.map(o=>`<label class="exercise-option"><input type="radio" name="ex-${ex.id}" value="${escHtml(o)}"> ${escHtml(o)}</label>`).join("");
    } else {
      inputHtml = `<input type="text" class="exercise-input" id="input-${ex.id}" placeholder="${u.fillPlaceholder}">`;
    }
    return `
      <div class="exercise-item" id="exercise-${ex.id}">
        <div class="exercise-question">${idx+1}. ${escHtml(ex.question)}</div>
        <div>${inputHtml}</div>
        <div class="exercise-feedback" id="feedback-${ex.id}"></div>
      </div>`;
  }).join("");

  area.innerHTML = `
    <div class="grammar-lesson">
      <h2 class="grammar-title">${escHtml(lesson.title)}</h2>
      <div class="grammar-content">${formatGrammarContent(lesson.content)}</div>
    </div>
    ${exs.length ? `
    <div class="exercise-section">
      <h3 class="exercise-heading">${u.exerciseHeading}</h3>
      <div class="exercise-list">${exHtml}</div>
      <button class="btn" id="btn-check-grammar">${u.checkBtn}</button>
      <div class="grammar-score" id="grammar-score"></div>
    </div>` : ""}
  `;
  const btnCheck = document.getElementById("btn-check-grammar");
  if(btnCheck) btnCheck.addEventListener("click", ()=> checkGrammarAnswers(exs));
}

function normalizeAnswer(s){ return String(s||"").trim().toLowerCase().replace(/\s+/g," "); }

function checkGrammarAnswers(exs){
  const u = L().ui;
  let correctCount = 0;
  exs.forEach(ex=>{
    let userAnswer = "";
    if(ex.type === "multiple_choice"){
      const checked = document.querySelector(`input[name="ex-${ex.id}"]:checked`);
      userAnswer = checked ? checked.value : "";
    } else {
      const inp = document.getElementById(`input-${ex.id}`);
      userAnswer = inp ? inp.value : "";
    }
    const isCorrect = normalizeAnswer(userAnswer) === normalizeAnswer(ex.correct_answer);
    if(isCorrect) correctCount++;
    const itemEl = document.getElementById(`exercise-${ex.id}`);
    itemEl.classList.remove("correct", "incorrect");
    itemEl.classList.add(isCorrect ? "correct" : "incorrect");
    const fb = document.getElementById(`feedback-${ex.id}`);
    let msg = isCorrect ? u.correctMsg : (u.wrongPrefix + ex.correct_answer);
    if(ex.explanation) msg += " — " + ex.explanation;
    fb.textContent = msg;
  });
  const scoreEl = document.getElementById("grammar-score");
  if(scoreEl) scoreEl.textContent = fmt(u.scoreLabel, {correct: correctCount, total: exs.length});
}

boot();
